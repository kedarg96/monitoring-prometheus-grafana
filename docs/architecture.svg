<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Monitoring and Alerting Stack: Prometheus and Grafana on Docker Compose</text>

  <!-- Compose boundary -->
  <rect x="235" y="50" width="665" height="400" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="255" y="74" font-size="13" font-weight="bold" fill="#075985">Docker Compose (WSL2 on a Windows laptop)</text>

  <!-- Traffic loop -->
  <rect x="30" y="95" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="115" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">curl traffic loop</text>
  <text x="115" y="145" text-anchor="middle" font-size="12" fill="#374151">/  /slow  /error</text>
  <text x="115" y="161" text-anchor="middle" font-size="12" fill="#374151">(load generator)</text>

  <!-- App -->
  <rect x="265" y="95" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="365" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Sample app (Flask)</text>
  <text x="365" y="143" text-anchor="middle" font-size="12" fill="#92400e">:8000  /metrics</text>
  <text x="365" y="161" text-anchor="middle" font-size="12" fill="#92400e">requests, errors, latency</text>

  <!-- Node exporter -->
  <rect x="265" y="230" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Node Exporter</text>
  <text x="365" y="278" text-anchor="middle" font-size="12" fill="#166534">:9100  /metrics</text>
  <text x="365" y="296" text-anchor="middle" font-size="12" fill="#166534">CPU, memory, disk, network</text>

  <!-- Prometheus -->
  <rect x="535" y="110" width="175" height="200" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="622" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Prometheus</text>
  <text x="622" y="158" text-anchor="middle" font-size="12" fill="#991b1b">:9090</text>
  <text x="622" y="180" text-anchor="middle" font-size="12" fill="#991b1b">scrapes every 15 s</text>
  <text x="622" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Alert rules</text>
  <text x="622" y="224" text-anchor="middle" font-size="12" fill="#991b1b">AppDown</text>
  <text x="622" y="242" text-anchor="middle" font-size="12" fill="#991b1b">HighErrorRate</text>
  <text x="622" y="260" text-anchor="middle" font-size="12" fill="#991b1b">HighCpuUsage</text>
  <text x="622" y="288" text-anchor="middle" font-size="11" fill="#991b1b">time series storage (volume)</text>

  <!-- Grafana -->
  <rect x="745" y="110" width="140" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="815" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">Grafana</text>
  <text x="815" y="158" text-anchor="middle" font-size="12" fill="#5b21b6">:3000</text>
  <text x="815" y="180" text-anchor="middle" font-size="12" fill="#5b21b6">Node Exporter</text>
  <text x="815" y="196" text-anchor="middle" font-size="12" fill="#5b21b6">dashboard + App</text>
  <text x="815" y="212" text-anchor="middle" font-size="12" fill="#5b21b6">Metrics dashboard</text>

  <!-- Browser -->
  <rect x="30" y="360" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="115" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Browser</text>
  <text x="115" y="412" text-anchor="middle" font-size="12" fill="#374151">dashboards and</text>
  <text x="115" y="428" text-anchor="middle" font-size="12" fill="#374151">Prometheus alerts page</text>

  <!-- Arrows -->
  <line x1="200" y1="135" x2="263" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="231" y="126" text-anchor="middle" font-size="11" fill="#374151">HTTP</text>

  <line x1="533" y1="150" x2="467" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="134" text-anchor="middle" font-size="11" fill="#374151">scrape</text>

  <line x1="533" y1="262" x2="467" y2="275" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="298" text-anchor="middle" font-size="11" fill="#374151">scrape</text>

  <line x1="743" y1="165" x2="712" y2="165" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="727" y="156" text-anchor="middle" font-size="11" fill="#374151">PromQL</text>

  <path d="M 200 400 L 815 400 L 815 222" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="420" y="392" text-anchor="middle" font-size="11" fill="#374151">view dashboards (localhost:3000)</text>

  <path d="M 622 400 L 622 312" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="632" y="360" font-size="11" fill="#374151">alerts and targets (:9090)</text>
</svg>
